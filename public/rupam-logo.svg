<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Skin Gradients -->
    <radialGradient id="faceGrad" cx="48%" cy="44%" r="54%">
      <stop offset="0%" stop-color="#F2B880" />
      <stop offset="65%" stop-color="#DC955A" />
      <stop offset="100%" stop-color="#B87139" />
    </radialGradient>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D78E52" />
      <stop offset="100%" stop-color="#AD652F" />
    </linearGradient>

    <!-- Pink Panjabi / Kurta Gradient -->
    <linearGradient id="kurtaGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FF74C6" />
      <stop offset="35%" stop-color="#F03298" />
      <stop offset="75%" stop-color="#D61A7C" />
      <stop offset="100%" stop-color="#A80F5D" />
    </linearGradient>

    <!-- Placket Embroidery Gradient -->
    <linearGradient id="placketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9AD5" />
      <stop offset="50%" stop-color="#D91B7E" />
      <stop offset="100%" stop-color="#9E0E58" />
    </linearGradient>

    <!-- VIDEO Green Gradient -->
    <linearGradient id="videoGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BEF264" />
      <stop offset="45%" stop-color="#65D628" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- EDITOR Orange-Gold Gradient -->
    <linearGradient id="editorOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#D9480F" />
    </linearGradient>

    <filter id="softDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#040814" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- STICKER OUTER BLACK BORDER + SOFT PINK INNER BORDER -->
  <g filter="url(#softDrop)">
    <!-- Outer dark sticker contour -->
    <path
      d="M 510 58
         C 575 58, 622 98, 625 162
         C 626 178, 636 196, 634 218
         C 632 246, 616 266, 602 282
         C 596 298, 594 316, 618 328
         C 665 344, 704 374, 724 445
         L 742 520
         L 292 520
         L 314 445
         C 334 374, 372 344, 420 328
         C 442 316, 440 298, 434 282
         C 418 266, 404 246, 402 218
         C 400 196, 410 178, 412 162
         C 415 98, 455 58, 510 58 Z"
      fill="#FAD4E2"
      stroke="#0A0E17"
      stroke-width="14"
      stroke-linejoin="round"
    />

    <!-- KURTA / PANJABI SHOULDERS & TORSO -->
    <path
      d="M 314 510
         C 328 415, 355 365, 425 344
         L 446 318
         L 584 318
         L 606 344
         C 675 365, 702 415, 718 510 Z"
      fill="url(#kurtaGrad)"
      stroke="#1E0818"
      stroke-width="4"
    />

    <!-- Embroidered Chest Placket & Collar -->
    <rect x="452" y="346" width="118" height="160" rx="6" fill="url(#placketGrad)" stroke="#B51267" stroke-width="3" />
    <rect x="488" y="352" width="46" height="150" fill="#E32285" stroke="#FF9AD5" stroke-width="2" />

    <!-- Collar Band -->
    <path
      d="M 444 316
         C 444 348, 480 364, 512 366
         C 544 364, 580 348, 580 316
         L 568 302
         C 550 328, 530 338, 512 340
         C 494 338, 474 328, 456 302 Z"
      fill="#F452A8"
      stroke="#B51267"
      stroke-width="3"
    />

    <!-- Gold Kurta Buttons -->
    <ellipse cx="504" cy="390" rx="9" ry="5" fill="#FBBF24" stroke="#78350F" stroke-width="2" />
    <ellipse cx="503" cy="438" rx="9" ry="5" fill="#FBBF24" stroke="#78350F" stroke-width="2" />

    <!-- NECK -->
    <path
      d="M 464 278 L 460 324 C 482 342, 540 342, 564 324 L 558 278 Z"
      fill="url(#neckGrad)"
    />

    <!-- EARS -->
    <ellipse cx="422" cy="222" rx="14" ry="26" fill="url(#faceGrad)" stroke="#8C4F23" stroke-width="2.5" />
    <ellipse cx="602" cy="222" rx="14" ry="26" fill="url(#faceGrad)" stroke="#8C4F23" stroke-width="2.5" />

    <!-- HEAD / FACE -->
    <path
      d="M 430 165
         C 430 115, 465 92, 512 92
         C 559 92, 594 115, 594 165
         C 596 228, 578 298, 512 302
         C 446 298, 428 228, 430 165 Z"
      fill="url(#faceGrad)"
      stroke="#7C431B"
      stroke-width="3"
    />

    <!-- HAIR -->
    <path
      d="M 426 178
         C 416 142, 432 94, 478 80
         C 506 72, 554 74, 582 94
         C 608 112, 610 148, 596 180
         C 590 154, 574 134, 540 132
         C 502 130, 472 138, 444 152
         C 436 160, 432 170, 426 178 Z"
      fill="#14161B"
    />

    <!-- EYEBROWS -->
    <path d="M 452 184 Q 476 174 496 182" fill="none" stroke="#18181B" stroke-width="6" stroke-linecap="round" />
    <path d="M 528 182 Q 550 174 574 184" fill="none" stroke="#18181B" stroke-width="6" stroke-linecap="round" />

    <!-- EYES -->
    <ellipse cx="475" cy="200" rx="14" ry="7" fill="#FFFFFF" />
    <circle cx="475" cy="200" r="6" fill="#1F1610" />
    <circle cx="473" cy="198" r="2" fill="#FFFFFF" />

    <ellipse cx="550" cy="200" rx="14" ry="7" fill="#FFFFFF" />
    <circle cx="550" cy="200" r="6" fill="#1F1610" />
    <circle cx="548" cy="198" r="2" fill="#FFFFFF" />

    <!-- NOSE -->
    <path d="M 512 196 L 506 232 C 500 238, 524 238, 518 232" fill="none" stroke="#8C4F23" stroke-width="4" stroke-linecap="round" />

    <!-- LIPS -->
    <path d="M 486 258 Q 512 266 538 258" fill="none" stroke="#7A3B2E" stroke-width="5" stroke-linecap="round" />
    <path d="M 492 260 Q 512 272 532 260" fill="none" stroke="#C06C5A" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- STACKED 3D EMBLEM TEXT: "VIDEO" & "EDITOR" -->
  <g filter="url(#softDrop)">
    <!-- Background 3D Extrusion Block behind Text -->
    <rect x="246" y="455" width="535" height="272" rx="48" transform="rotate(-3 512 585)" fill="#08132B" />

    <!-- "VIDEO" 3D Dark Outline + Extrusion -->
    <text
      x="505"
      y="582"
      text-anchor="middle"
      transform="rotate(-3 505 582)"
      font-family="'Syne', 'Arial Black', Impact, sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="136"
      letter-spacing="2"
      fill="#08132B"
      stroke="#08132B"
      stroke-width="38"
      stroke-linejoin="round"
    >
      VIDEO
    </text>

    <!-- "VIDEO" Vibrant Green Fill -->
    <text
      x="500"
      y="574"
      text-anchor="middle"
      transform="rotate(-3 500 574)"
      font-family="'Syne', 'Arial Black', Impact, sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="136"
      letter-spacing="2"
      fill="url(#videoGreen)"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linejoin="round"
    >
      VIDEO
    </text>

    <!-- "EDITOR" 3D Dark Outline + Extrusion -->
    <text
      x="522"
      y="714"
      text-anchor="middle"
      transform="rotate(-3 522 714)"
      font-family="'Syne', 'Arial Black', Impact, sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="128"
      letter-spacing="1"
      fill="#08132B"
      stroke="#08132B"
      stroke-width="38"
      stroke-linejoin="round"
    >
      EDITOR
    </text>

    <!-- "EDITOR" Vibrant Orange-Gold Fill -->
    <text
      x="516"
      y="706"
      text-anchor="middle"
      transform="rotate(-3 516 706)"
      font-family="'Syne', 'Arial Black', Impact, sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="128"
      letter-spacing="1"
      fill="url(#editorOrange)"
      stroke="#FFFBEB"
      stroke-width="3"
      stroke-linejoin="round"
    >
      EDITOR
    </text>
  </g>
</svg>
